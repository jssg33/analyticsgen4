<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exceptions · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Exceptions</h2>
  <div class="page-sub">Approved exclusions from auditing. <b>Endpoint exceptions</b> cover one endpoint, an API root URL or a path pattern like <code>/api/Student/*</code>. <b>Host exceptions</b> take a whole host out of auditing. Both apply only while active and not expired.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script>
const main = Cocky.layout("exceptions");
const qs = new URLSearchParams(location.search);

// Two tabs: endpoint exceptions (AuditExceptions) and whole-host exceptions (ApiHostException)
main.insertAdjacentHTML("beforeend", `
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link" data-tab="endpoints" type="button">Endpoint exceptions</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="hosts" type="button">Host exceptions</button></li>
  </ul>
  <div id="tab-endpoints"></div>
  <div id="tab-hosts" class="d-none">
    <div class="alert alert-info small py-2">A host exception takes a whole API out of auditing: while it's active and not expired,
      the host can't be audited (Audit host is blocked and its endpoints are locked out of every run).</div>
  </div>`);
const showTab = t => {
  main.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  document.getElementById("tab-endpoints").classList.toggle("d-none", t !== "endpoints");
  document.getElementById("tab-hosts").classList.toggle("d-none", t !== "hosts");
  history.replaceState(null, "", location.pathname + (t === "hosts" ? "?tab=hosts" : ""));
};
main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));

// --- endpoint exceptions ---
const epMount = document.getElementById("tab-endpoints");
const toolbar = `
  <select class="form-select form-select-sm view" style="max-width:170px">
    <option value="all">All exceptions</option>
    <option value="active">Active only</option>
    <option value="audit">For endpoint…</option>
  </select>
  <select class="form-select form-select-sm endpoint d-none" style="max-width:260px"><option value="">Loading endpoints…</option></select>`;
const view = () => epMount.querySelector(".view").value;
const endpointId = () => epMount.querySelector(".endpoint").value;
const page = Cocky.crudPage("auditexceptions", {
  mount: epMount,
  toolbarExtra: toolbar,
  source: () => {
    if (view() === "active") return "/active";
    if (view() === "audit" && endpointId()) return "/audit/" + encodeURIComponent(endpointId());
    return "";
  }
});
const viewSel = epMount.querySelector(".view"), epSel = epMount.querySelector(".endpoint");
if (qs.get("audit")) { viewSel.value = "audit"; epSel.classList.remove("d-none"); }
viewSel.onchange = () => { epSel.classList.toggle("d-none", view() !== "audit"); page.reload(); };
epSel.onchange = () => page.reload();
Cocky.api.list("apiaudit").then(eps => {
  epSel.innerHTML = eps.length
    ? eps.map(e => `<option value="${e.id}">#${e.id} ${Cocky.esc(e.description || e.url || "")}</option>`).join("")
    : '<option value="">No endpoints yet</option>';
  if (qs.get("audit")) { epSel.value = qs.get("audit"); page.reload(); }
}).catch(e => { epSel.innerHTML = '<option value="">Couldn\'t load endpoints</option>'; });

// --- host exceptions ---
const hostMount = document.getElementById("tab-hosts");
const hostPage = Cocky.crudPage("hostexceptions", { mount: hostMount });
// Opened from Hosts → "Except host": start a new host exception for that host
if (qs.get("host")) {
  showTab("hosts");
  Cocky.api.list("hostexceptions").catch(() => []).then(rows =>
    Cocky.openRecordForm("hostexceptions", null, rows, { apiHostId: +qs.get("host"), active: true, approvalDate: new Date().toISOString() })
  ).then(saved => { if (saved) hostPage.reload(); history.replaceState(null, "", location.pathname + "?tab=hosts"); });
} else showTab(qs.get("tab") === "hosts" ? "hosts" : "endpoints");
</script>
</body>
</html>
