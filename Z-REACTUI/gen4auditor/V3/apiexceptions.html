<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exceptions · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Exceptions</h2>
  <div class="page-sub">Endpoints excluded from audits. An exception can cover one endpoint, a whole API root URL, or a path pattern like <code>/api/Student/*</code>. Run Audit skips covered endpoints while the exception is active and not expired.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script>
const main = Cocky.layout("exceptions");
const qs = new URLSearchParams(location.search);
const toolbar = `
  <select class="form-select form-select-sm view" style="max-width:170px">
    <option value="all">All exceptions</option>
    <option value="active">Active only</option>
    <option value="audit">For endpoint…</option>
  </select>
  <select class="form-select form-select-sm endpoint d-none" style="max-width:260px"><option value="">Loading endpoints…</option></select>`;
let page;
const view = () => main.querySelector(".view").value;
const endpointId = () => main.querySelector(".endpoint").value;
page = Cocky.crudPage("auditexceptions", {
  mount: main,
  toolbarExtra: toolbar,
  source: () => {
    if (view() === "active") return "/active";
    if (view() === "audit" && endpointId()) return "/audit/" + encodeURIComponent(endpointId());
    return "";
  }
});
const viewSel = main.querySelector(".view"), epSel = main.querySelector(".endpoint");
if (qs.get("audit")) { viewSel.value = "audit"; epSel.classList.remove("d-none"); }
viewSel.onchange = () => { epSel.classList.toggle("d-none", view() !== "audit"); page.reload(); };
epSel.onchange = () => page.reload();
Cocky.api.list("apiaudit").then(eps => {
  epSel.innerHTML = eps.length
    ? eps.map(e => `<option value="${e.id}">#${e.id} ${Cocky.esc(e.description || e.url || "")}</option>`).join("")
    : '<option value="">No endpoints yet</option>';
  if (qs.get("audit")) { epSel.value = qs.get("audit"); page.reload(); }
}).catch(e => { epSel.innerHTML = '<option value="">Couldn\'t load endpoints</option>'; });
</script>
</body>
</html>
