<script>
/* ---------------------------------------------------------
   FIXED: window.onload no longer overwrites <body onload="">
--------------------------------------------------------- */
window.addEventListener("load", () => {
  if (!localStorage.getItem("uid") || localStorage.getItem("uid") === "901") {
    localStorage.setItem("uid", "901");
    localStorage.setItem("fullname", "Visitor");
    localStorage.setItem("role", "guest");
    localStorage.setItem("status", "loggedout");
    localStorage.setItem("isemployee","0");
    localStorage.setItem("activeurl", "./images/blackcircle.png");
  }
});

/* ---------------------------------------------------------
   LOGIN HANDLER
--------------------------------------------------------- */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const captcha  = window.grecaptcha && grecaptcha.getResponse();

  if (!username || !password) return alert("Username and password are required!");
  if (!captcha) return alert("Please complete the reCAPTCHA");

  const payload = {
    username: username,
    plainPassword: password
  };

  console.log("→ sending login payload:", payload);

  try {
    const res = await fetch(
      "https://cockyinvestments-ghehe0a8a7cge7fk.westus3-01.azurewebsites.net/api/Auth/login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }
    );

    console.log("← raw response status:", res.status);

    if (!res.ok) {
      const text = await res.text();
      console.error("Login API error:", res.status, text);
      return alert(`Login failed (HTTP ${res.status}):\n\n${text || "(no response body)"}`);
    }

    const user = await res.json();
    console.log("← parsed user:", user);

    alert("Login successful! Redirecting…");

    localStorage.setItem("token", user.token || "N/A");

    storeUserData(user);

    try { await logUserLogin(user, true); } catch (e) { console.error(e); }
    try { await createSession(user); } catch (e) { console.error(e); }

    const role = user.userRole ?? user.role ?? "guest";

    if (role === "admin") {
      window.location.href = "./adminhome.html";
    } else if (role === "superuser") {
      window.location.href = "./manager.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (err) {
    console.error("Fetch/login error:", err);
    alert("An error occurred: " + err.message);
  }
});

/* ---------------------------------------------------------
   STORE USER DATA (Version 1 field names preserved)
--------------------------------------------------------- */
function storeUserData(u) {
  console.log("storeUserData input:", u);

  localStorage.setItem("uid",           u.userId);
  localStorage.setItem("fullname",     u.userFullName);
  localStorage.setItem("role",         u.userRole);
  localStorage.setItem("status",       "loggedin");
  localStorage.setItem("firstname",    u.userFirstname);
  localStorage.setItem("lastname",     u.userLastname);
  localStorage.setItem("username",     u.userUsername);
  localStorage.setItem("email",        u.userEmail);
  localStorage.setItem("employeeid",   u.employeeId || "N/A");
  localStorage.setItem("isemployee",   u.isEmployee);
  localStorage.setItem("microsoftid",  u.userMicrosoftId || "");
  localStorage.setItem("ncrid",        u.userNcrId || "");
  localStorage.setItem("oracleid",     u.userOracleId || "");
  localStorage.setItem("azureid",      u.userAzureId || "");
  localStorage.setItem("jid",          u.userJid || "");

  const profileUrl = u.userProfileUrl || "./images/blackcircle.png";
  localStorage.setItem("profileurl",       profileUrl);
  localStorage.setItem("activepictureurl", profileUrl);
  localStorage.setItem("activeurl",        profileUrl);

  localStorage.setItem("company",      u.userCompany || "");
  localStorage.setItem("btn",          u.userBtn || "");
  localStorage.setItem("iscertified",  u.userIsCertified ?? false);
  localStorage.setItem("logindate",    u.date);
}

/* ---------------------------------------------------------
   USER LOGIN LOGGING
--------------------------------------------------------- */
async function logUserLogin(user, success) {
  const ip    = await getIpAddress();
  const stat  = success ? "successful" : "failed";
  const uname = user.userUsername;

  const descr = `Login ${stat} for ${uname} from ${ip} at ${new Date().toLocaleString()}`;

  $.ajax({
    url: "https://cockyinvestments-ghehe0a8a7cge7fk.westus3-01.azurewebsites.net/api/Userlog",
    method: "POST",
    contentType: "application/json",
    data: JSON.stringify({ descr }),
  }).fail(xhr => console.error("Log error:", xhr.responseText));
}

/* ---------------------------------------------------------
   GET IP ADDRESS
--------------------------------------------------------- */
async function getIpAddress() {
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    return (await r.json()).ip;
  } catch {
    return "Unknown IP";
  }
}

/* ---------------------------------------------------------
   CREATE SESSION (Version 1 field names preserved)
--------------------------------------------------------- */
async function createSession(u) {
  let someuid = Number(u.userId);
  if (isNaN(someuid)) someuid = 1;

  const someemail    = u.userEmail;
  const somerole     = u.userRole;
  const somefirstname= u.userFirstname;
  const somelastname = u.userLastname;
  const somefullname = u.userFullName;
  const someusername = u.userUsername;
  let   sometoken    = u.token || "defaulttoken";

  const currentDate  = new Date();
  const utcOffset    = currentDate.getTimezoneOffset() * 60000;
  const estOffset    = -5 * 3600000;
  const estDate      = new Date(currentDate.getTime() + utcOffset + estOffset);

  const somedata = {
    userid: someuid,
    token:  sometoken,
    sessionusername:  someusername,
    sessionfirstname: somefirstname,
    sessionlastname:  somelastname,
    sessionemail:     someemail
  };

  console.log("Usersession payload:", somedata);

  $.ajax({
    url: 'https://cockyinvestments-ghehe0a8a7cge7fk.westus3-01.azurewebsites.net/api/Usersession',
    type: 'POST',
    contentType: 'application/json',
    data: JSON.stringify(somedata),
    success: function(response) {
      console.log('Record posted successfully:', response);
    },
    error: function(error) {
      console.log('Error posting record:', error);
      console.log('Record details on error:', somedata);
    }
  });
}

/* ---------------------------------------------------------
   CANCEL BUTTON
--------------------------------------------------------- */
document.getElementById("cancelButton").addEventListener("click", () => {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  if (window.grecaptcha) grecaptcha.reset();

  localStorage.setItem("uid", "901");
  localStorage.setItem("fullname", "Visitor");
  localStorage.setItem("role", "guest");
  localStorage.setItem("status", "loggedout");
});
