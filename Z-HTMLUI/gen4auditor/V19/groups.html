<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/cockyciphers.js"></script>
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groups · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Groups</h2>
  <div class="page-sub">User groups (Usergroups). <b>Members</b> picks who is in a group; a user can be in up to five groups, stored in their
    <code>groupid1</code>–<code>groupid5</code> as the group's code. You can also set a user's groups from the <a href="users.html">Users</a> page.
    Deleting a group takes it off its members first.</div>
  <div id="setup"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="groups.js"></script>
<script>
const main = Cocky.layout("groups");
const { esc, api } = Cocky, G = Groups;
let users = [], keys = [];
const SECRET = /password|resettoken/i;
async function loadUsers() {
  users = (await api.list("users")).map(u => { const c = {}; Object.keys(u).forEach(k => { if (!SECRET.test(k)) c[k] = u[k]; }); return c; });
  keys = G.slotKeys(users);
  document.getElementById("setup").innerHTML = users.length && !G.hasSlots(users)
    ? `<div class="alert alert-warning small"><b>The Users API doesn't return ${G.GC.userSlots.map(s => `<code>${esc(s)}</code>`).join(", ")}</b>, so members can't be shown or saved. Check the User model and the slot names in <code>config.js</code> → <code>groups.userSlots</code>.</div>` : "";
}
const badge = f => {
  if (!f.length) return '<span class="badge text-bg-success">OK</span>';
  const lv = f.some(x => x.level === "fail") ? "danger" : f.some(x => x.level === "warn") ? "warning" : "secondary";
  return `<span class="badge text-bg-${lv}" title="${esc(f.map(x => `${x.level.toUpperCase()}: ${x.text}`).join("\n"))}">${f.filter(x => x.level !== "info").length || f.length} ${f.some(x => x.level !== "info") ? "issue" : "note"}${f.length === 1 ? "" : "s"}</span>`;
};
Cocky.SCHEMA.usergroups.format = {
  groupdescription: (v, g) => `<b>${esc(G.label(g))}</b>`,
  groupid: (v, g) => G.str(g, "groupid") ? `<code>${esc(G.str(g, "groupid"))}</code>` : '<span class="text-muted small">none (uses #' + g.id + ')</span>',
  owner: (v, g) => { const id = G.ownerId(g); if (id == null) return '<span class="text-muted small">—</span>';
    const u = users.find(x => x.id === id); return u ? esc(G.userName(u)) : `<span class="badge text-bg-danger">User #${id} missing</span>`; },
  groupcompanyid: v => v ? esc(v) : '<span class="text-muted small">—</span>',
  members: (v, g) => {
    const m = users.filter(u => G.isMember(u, g, page.rows(), keys));
    if (!m.length) return '<span class="text-muted small">None</span>';
    return `<b>${m.length}</b> <span class="small text-muted">${m.slice(0, 4).map(u => esc(G.userName(u))).join(", ")}${m.length > 4 ? ` +${m.length - 4}` : ""}</span>`;
  },
  findings: (v, g) => badge(G.groupFindings(g, page.rows(), users, keys))
};

let page;
(async () => {
  try { await api.list("usergroups"); }
  catch (e) { if (e.status === 404) { document.getElementById("setup").innerHTML = `<div class="alert alert-warning">The API didn't answer on <code>${esc(Cocky.CFG.endpoints.usergroups)}</code> (set in config.js).</div>`; return; } }
  page = Cocky.crudPage("usergroups", {
    mount: main,
    columns: Cocky.SCHEMA.usergroups.columns,
    beforeLoad: loadUsers,
    sort: rows => rows.slice().sort((a, b) => G.label(a).localeCompare(G.label(b))),
    rowActions: [{ label: "Members", className: "btn-primary", onClick: openMembers }],
    // New groups: start owned by the signed-in user
    addDefaults: () => { const me = window.CockyAuth?.current?.() || {}; return me.userid && !me.testLogin ? { groupownerid: +me.userid } : {}; },
    // Take the group off its members first (their slots), and put it back if the delete then fails
    beforeDelete: async g => {
      const groups = page.rows(), members = users.filter(u => G.isMember(u, g, groups, keys)), done = [];
      for (const u of members) { const before = G.groupsOf(u, groups, keys); await G.saveUserGroups(u, before.filter(x => x.id !== g.id), groups, keys); done.push([u, before]); }
      return async () => { for (const [u, before] of done) await G.saveUserGroups(u, before, groups, keys); };
    },
    onCreated: saved => { const g = saved?.id ? page.rows().find(r => r.id === saved.id) : null; if (g) openMembers(g); }
  });
})();

async function openMembers(g) {
  if (!G.hasSlots(users) && users.length) { Cocky.toast("The Users API doesn't return the group slots, so members can't be saved.", "warning"); return; }
  const r = await G.editMembers(g, page.rows(), users);
  if (r) { Cocky.toast(`${G.label(g)}: ${r.added} added, ${r.removed} removed.`, r.failures.length ? "warning" : "success"); page.reload(); }
}
</script>
</body>
</html>
