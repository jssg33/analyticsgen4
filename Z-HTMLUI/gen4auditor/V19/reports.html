<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/cockyciphers.js"></script>
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Reports</h2>
  <div class="page-sub">System reports you can run. Each opens in its own page, ready to print or download as CSV.
    The list lives in <code>config.js</code> → <code>reports</code>.</div>
  <div class="card"><div class="card-body p-0" id="list"></div></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script>
Cocky.layout("reports");
const { esc } = Cocky;
const reports = Cocky.CFG.reports || [];
document.getElementById("list").innerHTML = reports.length ? `<div class="table-responsive"><table class="table table-hover align-middle mb-0">
  <thead class="table-light"><tr><th class="small text-uppercase text-muted">Report</th><th class="small text-uppercase text-muted">Description</th><th></th></tr></thead>
  <tbody>${reports.map(r => `<tr class="clickable" data-href="${esc(r.file)}">
    <td class="text-nowrap"><div class="fw-semibold">${esc(r.title)}</div><code class="small">${esc(r.file)}</code></td>
    <td class="small">${esc(r.description || "")}</td>
    <td class="text-end"><a class="btn btn-sm btn-primary" href="${esc(r.file)}">Run</a></td></tr>`).join("")}</tbody></table></div>`
  : '<div class="empty m-3">No reports configured.</div>';
document.querySelectorAll("tr[data-href]").forEach(tr => tr.onclick = e => { if (!e.target.closest("a")) location.href = tr.dataset.href; });
</script>
</body>
</html>
