<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Customers</h2>
  <div class="page-sub">Customer maintenance (the Customer table): add, edit and delete customers. <b>User ID</b> is what ties a customer to
    their tickets on <a href="customer.html">Customer Troubles</a>; <b>Customer tickets</b> counts them (open / total).</div>
  <div id="setup"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script>
const main = Cocky.layout("customers");
const { esc, api, CFG } = Cocky;
let tickets = [], userKey = null, statusKey = null;
const CLOSED = new RegExp((CFG.customerTroubles || {}).closedMatch || "^(closed|resolved|done|complete|completed|cancel+ed|fixed)$", "i");
const lc = v => String(v ?? "").trim().toLowerCase();
// Customer tickets (Userhelp), to count each customer's tickets by user id
async function loadTickets() {
  try { tickets = (await api.list("customertroubles")).filter(r => r && typeof r === "object"); } catch { tickets = []; }
  const keys = [...new Set(tickets.slice(0, 50).flatMap(r => Object.keys(r)))];
  const want = (CFG.customerTroubles || {}).userField;
  userKey = (want && keys.find(k => lc(k) === lc(want))) || keys.find(k => /^(user_?id|customer_?id|userid)$/i.test(k)) || null;
  statusKey = keys.find(k => /^(status|state|ticket_?status|help_?status)$/i.test(k)) || null;
}
const ticketsOf = c => userKey && c.userId != null ? tickets.filter(t => lc(t[userKey]) === lc(c.userId)) : [];

Cocky.SCHEMA.customers.format = {
  fullName: (v, c) => v ? `<b>${esc(v)}</b>` : '<span class="text-muted">—</span>',
  userId: v => v ? `<code>${esc(v)}</code>` : '<span class="badge text-bg-danger">missing</span>',
  tenantid: v => v ? `<span class="badge text-bg-light border fw-normal">${esc(v)}</span>` : '<span class="text-muted small">—</span>',
  portfolios: (v, c) => Array.isArray(c.portfolios) ? (c.portfolios.length || '<span class="text-muted small">0</span>') : '<span class="text-muted small">—</span>',
  tickets: (v, c) => {
    if (!userKey) return '<span class="text-muted small">n/a</span>';
    const t = ticketsOf(c); if (!t.length) return '<span class="text-muted small">0</span>';
    const open = statusKey ? t.filter(x => !CLOSED.test(String(x[statusKey] ?? "").trim())).length : t.length;
    return `<a href="customer.html?q=${encodeURIComponent(c.userId)}" class="text-decoration-none">${open ? `<span class="badge text-bg-danger">${open} open</span> ` : ""}${t.length} total</a>`;
  }
};

let page;
(async () => {
  // Customers may be on /api/Customers or /api/Customer: use whichever answers
  try { await api.list("customers"); }
  catch (e) {
    if ([404, 405].includes(e.status) && CFG.endpoints.customersAlt) {
      CFG.endpoints.customers = CFG.endpoints.customersAlt;
      try { await api.list("customers"); }
      catch (e2) { document.getElementById("setup").innerHTML = `<div class="alert alert-warning">The API didn't answer on <code>/api/Customers</code> or <code>${esc(CFG.endpoints.customersAlt)}</code>. Set the route in <code>config.js</code> → <code>endpoints.customers</code>.</div>`; return; }
    }
  }
  page = Cocky.crudPage("customers", {
    mount: main,
    columns: Cocky.SCHEMA.customers.columns,
    beforeLoad: loadTickets,
    sort: rows => rows.slice().sort((a, b) => String(a.fullName || "").localeCompare(String(b.fullName || ""))),
    addDefaults: () => ({ createdAt: new Date().toISOString() }),
    canDelete: c => Array.isArray(c.portfolios) && c.portfolios.length ? `${c.fullName || "This customer"} has ${c.portfolios.length} portfolio(s); remove them first.` : null
  });
})();
</script>
</body>
</html>
