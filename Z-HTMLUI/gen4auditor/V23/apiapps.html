<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/cockyciphers.js"></script>
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Applications</h2>
  <div class="page-sub">An application uses one or more of your host APIs. <b>Link hosts</b> chooses which hosts it uses; a host can belong to more than one application. <b>Endpoints</b> is the total across all of an application's hosts.</div>
  <div id="setup"></div>
</section>

<!-- Link hosts dialog -->
<div class="modal fade" id="linkModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input class="form-control form-control-sm mb-2 link-search" placeholder="Search hosts…">
    <div class="link-list"></div>
    <div class="link-error alert alert-danger small mt-3 d-none"></div>
  </div>
  <div class="modal-footer justify-content-between">
    <div class="small text-muted link-summary"></div>
    <div><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
      <button class="btn btn-primary link-save" type="button">Save</button></div>
  </div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="infra.js"></script>
<script>
const main = Cocky.layout("apps");
const esc = Cocky.esc;

// Lookup data used by the computed columns; reloaded on every refresh
let hosts = [], endpoints = [], links = [], hostExc = [];
let rollup = new Map();   // appId -> { hosts, total, active, ... }
let infra = Infra.evaluate({});   // web server / farm / database each app runs on (build 4.9)
async function loadLookups() {
  const [h, e, l, x, d] = await Promise.all([
    Cocky.api.list("apihosts"),
    Cocky.api.list("apiaudit"),
    Cocky.api.list("apphosts"),
    Cocky.api.list("hostexceptions").catch(() => []),
    Infra.loadAll().catch(() => ({}))
  ]);
  hosts = h; endpoints = e; links = l; hostExc = x; infra = Infra.evaluate(d);
}
const hostLabel = h => h.apiHostName || h.apiHostUrl || "#" + h.id;
const epCountByHost = id => endpoints.filter(e => e.apiHostId === id).length;

// ---------- UI codebase (build 5.7): config.js appUi ----------
const UI = Infra.UI;
const uiTag = def => def ? `<span class="badge fw-normal me-1" style="background:${def.color || "#6c757d"}">${esc(def.label)}</span>` : "";
let uiFieldsMissing = false;   // the API doesn't return UI_Codebase yet

Cocky.SCHEMA.apps.format = {
  // Codebase: the badge, with the UI vendor(s) underneath
  uiCodebase: (v, r) => {
    if (!Infra.hasUiFields(r)) return '<span class="small text-muted">—</span>';
    const { value, def } = Infra.codebaseOf(r);
    const head = !value ? '<span class="badge text-bg-warning fw-normal">Not set</span>'
      : def ? uiTag(def) : `<span class="badge text-bg-danger fw-normal" title="Not one of ${esc(UI.codebases.map(c => c.value).join(", "))}">${esc(value)}?</span>`;
    const vendors = Infra.appOs(r).filter(x => x.vendor);
    return head + vendors.map(x => `<div class="small text-muted text-nowrap" title="${esc(x.label)} vendor">${esc(x.vendor)}</div>`).join("");
  },
  // App OS: the operating system of the app's UI for its codebase; the API's OS and hosting vendor underneath
  appOs: (v, r) => {
    if (!Infra.hasUiFields(r)) return '<span class="small text-muted">—</span>';
    const { def } = Infra.codebaseOf(r), xs = Infra.appOs(r), several = xs.length > 1;
    const lines = xs.map(x => x.os
      ? `<div class="text-nowrap">${several ? `<span class="small text-muted">${esc(x.label.replace(" UI", ""))}:</span> ` : ""}${esc(x.os)}</div>`
      : `<div class="small text-warning text-nowrap">${esc(x.label)} OS not recorded</div>`);
    if (!xs.length) lines.push(`<div class="small ${def ? "text-warning" : "text-muted"} text-nowrap">Not recorded</div>`);
    const api = [Infra.uiField(r, "apiOs"), Infra.uiField(r, "apiVendor")].filter(Boolean).join(" · ");
    return lines.join("") + (api ? `<div class="small text-muted text-nowrap" title="API operating system · hosting vendor">API: ${esc(api)}</div>` : "");
  },
  hostApis: (v, r) => {
    const x = rollup.get(r.id);
    if (!x || !x.hosts.length) return '<span class="text-muted small">No hosts linked</span>';
    return x.hosts.map(h => {
      const exc = Cocky.hostException(hostExc, h.id);
      return `<span class="badge ${exc ? "text-bg-warning" : "text-bg-light border"} me-1 mb-1 fw-normal" title="${esc(h.apiHostUrl || "")}${exc ? " · excepted from auditing" : ""}">${esc(hostLabel(h))}</span>`;
    }).join("");
  },
  // Web server or farm + database, with the app's Infra Audit badge
  infra: (v, r) => {
    const ix = infra.index, bits = [];
    const chip = (id, map, kind, icon) => {
      if (!id) return;
      const x = map.get(id);
      bits.push(x ? `<a href="${Infra.KINDS[kind].page}" class="badge ${Infra.isActive(kind, x) ? "text-bg-light border" : "text-bg-secondary"} fw-normal text-decoration-none me-1 mb-1" title="${Infra.KINDS[kind].label}">${icon} ${esc(Infra.KINDS[kind].name(x))}</a>`
        : `<span class="badge text-bg-danger fw-normal me-1 mb-1">${Infra.KINDS[kind].label} #${id} missing</span>`);
    };
    chip(Infra.num(r, "webFarmId"), ix.wf, "webfarms", "Farm");
    chip(Infra.num(r, "webServerId"), ix.ws, "webservers", "Web");
    chip(Infra.num(r, "databaseId"), ix.db, "databases", "DB");
    if (!bits.length) return '<span class="small text-muted">Not recorded</span>';
    const res = infra.get("apps", r.id);
    return bits.join("") + (res && ["fail", "warn"].includes(res.status) ? " " + Infra.badge(res) : "");
  },
  endpointTotal: (v, r) => {
    const x = rollup.get(r.id);
    if (!x || !x.total) return '<span class="text-muted">0</span>';
    const audited = x.endpoints.filter(e => e.lastAuditDate).length;
    return `<a href="apiendpoints.html?app=${r.id}" class="text-decoration-none"><b>${x.total}</b></a>` +
      `<div class="small text-muted text-nowrap">${x.active} active${audited < x.total ? ` · ${x.total - audited} never audited` : ""}</div>`;
  }
};

// Add / Edit: dim the UI vendor / OS fields the chosen codebase doesn't use (they stay editable and are still saved)
Cocky.SCHEMA.apps.onForm = form => {
  const sel = [...form.querySelectorAll("select[data-key]")].find(el => Cocky.normKey(el.dataset.key) === Cocky.normKey(UI.fields.codebase));
  if (!sel) return;
  const keyOf = part => Cocky.normKey(UI.fields[part]);
  const setOf = { [keyOf("htmlVendor")]: "html", [keyOf("htmlOs")]: "html", [keyOf("reactVendor")]: "react", [keyOf("reactOs")]: "react" };
  const apply = () => {
    const def = UI.codebases.find(c => c.value.toLowerCase() === sel.value.toLowerCase());
    form.querySelectorAll("[data-field]").forEach(box => {
      const set = setOf[Cocky.normKey(box.dataset.field)];
      if (!set) return;
      const off = def && !(def.uses || []).includes(set);
      box.classList.toggle("opacity-50", !!off);
      let hint = box.querySelector(".ui-hint");
      if (off && !hint) { box.insertAdjacentHTML("beforeend", '<div class="form-text ui-hint"></div>'); hint = box.querySelector(".ui-hint"); }
      if (hint) hint.textContent = off ? `Not used by ${def.label} apps` : "";
    });
    let note = sel.parentElement.querySelector(".ui-hint-main");
    if (!note) { sel.insertAdjacentHTML("afterend", '<div class="form-text ui-hint-main"></div>'); note = sel.parentElement.querySelector(".ui-hint-main"); }
    note.textContent = !def ? (sel.value ? "Not one of the listed codebases." : "Mobile, HTML, Ionic or React. Decides which vendor and OS fields apply.")
      : `Fill in ${(def.uses || []).map(s => Infra.UI_SETS[s].label).join(def.needs === "any" ? " or " : " and ")} vendor and OS, plus the API's.`;
  };
  sel.addEventListener("change", apply);
  apply();
};

// Codebase filter (apiapps.html?ui=react, ?ui=unset)
let uiFilter = new URLSearchParams(location.search).get("ui") || "";
function filterByUi(rows) {
  if (!uiFilter) return rows;
  return rows.filter(r => {
    const { value, def } = Infra.codebaseOf(r);
    if (uiFilter === "unset") return !value;
    if (uiFilter === "other") return value && !def;
    return def && def.value === uiFilter;
  });
}
function drawUiFilter(rows) {
  const el = document.getElementById("uiFilter");
  if (!el) return;
  uiFieldsMissing = rows.length > 0 && !rows.some(Infra.hasUiFields);
  el.classList.toggle("d-none", uiFieldsMissing);
  const n = f => { const keep = uiFilter; uiFilter = f; const x = filterByUi(rows).length; uiFilter = keep; return x; };
  const other = n("other");
  el.innerHTML = `<option value="">All codebases</option>` +
    UI.codebases.map(c => `<option value="${esc(c.value)}">${esc(c.label)} (${n(c.value)})</option>`).join("") +
    `<option value="unset">Not set (${n("unset")})</option>` + (other ? `<option value="other">Not in the list (${other})</option>` : "");
  el.value = uiFilter;
  document.getElementById("setup").innerHTML = uiFieldsMissing ? `<div class="alert alert-info small">
    <b>The API doesn't return the UI codebase fields yet.</b> Add <code>UI_Codebase</code>, <code>APIVendor</code>, <code>UI_HTMLVendor</code>,
    <code>UI_REACTVendor</code>, <code>OS_UIHTML</code>, <code>OS_UIREACT</code> and <code>OS_API</code> to the Application model, then recompile and deploy the API.
    The Codebase and App OS columns and the codebase filter fill in once it does.</div>` : "";
}

// Totals row under the grid (for the apps shown after search). Endpoints and hosts shared by several apps
// are counted once in the totals, so the Endpoints total can be less than the sum of the column.
function totalsRow(shown) {
  const xs = shown.map(a => rollup.get(a.id)).filter(Boolean);
  const hostIds = new Set(xs.flatMap(x => x.hosts.map(h => h.id)));
  const eps = new Map(xs.flatMap(x => x.endpoints.map(e => [e.id, e])));
  const all = [...eps.values()], sum = xs.reduce((s, x) => s + x.total, 0);
  const active = all.filter(e => e.isActive !== false).length, audited = all.filter(e => e.lastAuditDate).length;
  const unlinked = Cocky.unlinkedHosts(hosts, links, page.rows());
  const unlinkedEps = endpoints.filter(e => unlinked.some(h => h.id === e.apiHostId)).length;
  const noHost = endpoints.filter(e => e.apiHostId == null || !hosts.some(h => h.id === e.apiHostId)).length;
  return {
    id: `Total`,
    applicationName: `${shown.length} app${shown.length === 1 ? "" : "s"}`,
    hostApis: `${hostIds.size} host${hostIds.size === 1 ? "" : "s"}`,
    endpointTotal: `<b>${all.length}</b><div class="small text-muted fw-normal text-nowrap">${active} active${audited < all.length ? ` · ${all.length - audited} never audited` : ""}</div>` +
      (sum !== all.length ? `<div class="small text-muted fw-normal text-nowrap" title="Some hosts are shared by more than one app; the total counts each endpoint once">${sum} across apps</div>` : ""),
    _note: `All endpoints: <b>${endpoints.length}</b>` +
      (unlinkedEps ? ` · <b>${unlinkedEps}</b> on ${unlinked.length} host(s) not linked to any app (${unlinked.map(h => esc(hostLabel(h))).join(", ")})` : "") +
      (noHost ? ` · <b>${noHost}</b> with no host` : "")
  };
}

// Show a setup note instead of a raw error if the API doesn't have the Apps tables yet
function showSetupNote(e) {
  document.getElementById("setup").innerHTML = `<div class="alert alert-warning">
    <strong>The API didn't answer on the Application routes.</strong> CockyAuditor expects
    <code>${esc(Cocky.CFG.endpoints.apps)}</code> and <code>${esc(Cocky.CFG.endpoints.apphosts)}</code>
    (set in <code>config.js</code>). Check the API has been deployed with <code>MapApplicationEndpoints()</code> and <code>MapApplicationApiEndpoints()</code>.
    <div class="small mt-2 text-muted">${esc(e.message)}</div></div>`;
}

let page;
(async () => {
  try { await Cocky.api.list("apps"); }
  catch (e) { if (e.status === 404) { showSetupNote(e); return; } }
  page = Cocky.crudPage("apps", {
    mount: main,
    columns: Cocky.SCHEMA.apps.columns,
    beforeLoad: loadLookups,
    footer: totalsRow,
    toolbarExtra: '<select class="form-select form-select-sm" id="uiFilter" style="max-width:220px" title="UI codebase"></select>',
    filter: filterByUi,
    onLoaded: drawUiFilter,
    sort: rows => {
      rollup = new Map(Cocky.appRollup(rows, links, hosts, endpoints).map(x => [x.app.id, x]));
      return rows.slice().sort((a, b) => String(a.applicationName || "").localeCompare(String(b.applicationName || "")));
    },
    // Remove the application's ApplicationApi links first, so the delete works whether or not the database cascades
    beforeDelete: app => Cocky.removeAppLinks(l => l.applicationId === app.id),
    rowActions: [
      { label: "Link hosts", onClick: openLinks },
      { label: "Endpoints", onClick: a => location.href = "apiendpoints.html?app=" + a.id },
      {
        // Enterprise(9) logs for the app's linked API set; the badge is how many log sets its endpoints include
        className: "btn-warning",
        label: a => { const n = Cocky.e9.sets(rollup.get(a.id)?.endpoints).length;
          return `Enterprise(9)${n ? ` <span class="badge text-bg-dark ms-1">${n}</span>` : ""}`; },
        title: a => { const x = rollup.get(a.id), n = Cocky.e9.sets(x?.endpoints).length;
          return !x?.hosts.length ? "No hosts linked yet; shows the standard log routes once hosts are linked"
            : `${n} Enterprise(9) log set(s) registered on ${x.hosts.length} linked host(s)`; },
        onClick: a => location.href = "enterprise9.html?app=" + a.id
      }
    ],
    // After adding an app, go straight to choosing its hosts
    onCreated: saved => {
      const app = saved.id ? page.rows().find(r => r.id === saved.id)
        : page.rows().filter(r => r.applicationName === saved.applicationName).sort((a, b) => b.id - a.id)[0];
      if (app) openLinks(app);
    }
  });
  document.getElementById("uiFilter").onchange = e => {
    uiFilter = e.target.value;
    const u = new URL(location.href); uiFilter ? u.searchParams.set("ui", uiFilter) : u.searchParams.delete("ui");
    history.replaceState(null, "", u);
    page.redraw();
  };
})();

// ---- Link hosts dialog ----
const lm = document.getElementById("linkModal");
const lmBs = bootstrap.Modal.getOrCreateInstance(lm);
function openLinks(app) {
  const current = links.filter(l => l.applicationId === app.id);
  const picked = new Set(current.map(l => l.apiHostId));
  lm.querySelector(".modal-title").textContent = `Hosts used by ${app.applicationName || "app #" + app.id}`;
  const err = lm.querySelector(".link-error"); err.classList.add("d-none");
  const search = lm.querySelector(".link-search"); search.value = "";
  const list = lm.querySelector(".link-list");
  const sorted = hosts.slice().sort((a, b) => hostLabel(a).localeCompare(hostLabel(b)));

  const summary = () => {
    const n = [...picked].reduce((s, id) => s + epCountByHost(id), 0);
    lm.querySelector(".link-summary").textContent = `${picked.size} host${picked.size === 1 ? "" : "s"} selected · ${n} endpoint${n === 1 ? "" : "s"} in total`;
  };
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    const shown = sorted.filter(h => !q || [h.apiHostName, h.apiHostUrl, h.environment, h.id].some(v => String(v ?? "").toLowerCase().includes(q)));
    list.innerHTML = shown.length ? `<div class="list-group">${shown.map(h => {
      const exc = Cocky.hostException(hostExc, h.id);
      const others = links.filter(l => l.apiHostId === h.id && l.applicationId !== app.id).length;
      return `<label class="list-group-item d-flex gap-3 align-items-start">
        <input class="form-check-input mt-1" type="checkbox" value="${h.id}" ${picked.has(h.id) ? "checked" : ""}>
        <span class="flex-grow-1"><span class="fw-semibold">${esc(hostLabel(h))}</span>
          ${exc ? '<span class="badge text-bg-warning ms-1">Excepted</span>' : ""}
          ${h.environment ? `<span class="badge text-bg-light border ms-1 fw-normal">${esc(h.environment)}</span>` : ""}
          <br><span class="small text-muted">${esc(h.apiHostUrl || "")}${others ? ` · also used by ${others} other app${others === 1 ? "" : "s"}` : ""}</span></span>
        <span class="text-nowrap small"><b>${epCountByHost(h.id)}</b> endpoints</span></label>`;
    }).join("")}</div>` : `<div class="empty">${hosts.length ? "No hosts match your search." : "No hosts yet. Add one on the Hosts page first."}</div>`;
    list.querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = () => {
      cb.checked ? picked.add(+cb.value) : picked.delete(+cb.value); summary();
    });
  };
  search.oninput = draw;
  draw(); summary();

  const save = lm.querySelector(".link-save");
  save.onclick = async () => {
    const before = new Set(current.map(l => l.apiHostId));
    const toAdd = [...picked].filter(id => !before.has(id));
    const toRemove = current.filter(l => !picked.has(l.apiHostId));
    if (!toAdd.length && !toRemove.length) { lmBs.hide(); return; }
    save.disabled = true; save.textContent = "Saving…";
    const failures = [];
    await Promise.all([
      ...toAdd.map(id => Cocky.api.create("apphosts", { applicationId: app.id, apiHostId: id, createdDate: new Date().toISOString() })
        .catch(e => failures.push(e.message))),
      ...toRemove.map(l => Cocky.api.remove("apphosts", l.id).catch(e => failures.push(e.message)))
    ]);
    save.disabled = false; save.textContent = "Save";
    if (failures.length) {
      err.textContent = `${failures.length} change(s) failed: ${failures[0]}`; err.classList.remove("d-none");
      page.reload(); return;
    }
    lmBs.hide();
    Cocky.toast(`${app.applicationName || "App"}: ${toAdd.length ? `${toAdd.length} host(s) linked` : ""}${toAdd.length && toRemove.length ? ", " : ""}${toRemove.length ? `${toRemove.length} unlinked` : ""}.`);
    page.reload();
  };
  lmBs.show();
}
</script>
</body>
</html>
