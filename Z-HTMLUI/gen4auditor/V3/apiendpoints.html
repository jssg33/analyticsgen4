<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endpoints · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Endpoints</h2>
  <div class="page-sub">API endpoints registered for auditing (from /api/Apiaudit).</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script>
const main = Cocky.layout("endpoints");
Cocky.crudPage("apiaudit", {
  mount: main,
  rowActions: [
    { label: "Audit", onClick: r => location.href = "apiaudit.html?id=" + r.id },
    { label: "Exceptions", onClick: r => location.href = "apiexceptions.html?audit=" + r.id }
  ]
});
</script>
</body>
</html>
