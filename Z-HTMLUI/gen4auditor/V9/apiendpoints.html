<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endpoints · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Endpoints</h2>
  <div class="page-sub">Every endpoint registered for auditing. To import a whole API at once, use <b>Add API from Swagger</b>.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="swagger-import.js"></script>
<script>
const main = Cocky.layout("endpoints");
const page = Cocky.crudPage("apiaudit", {
  mount: main,
  toolbarExtra: `<select class="form-select form-select-sm host-filter" style="max-width:240px"><option value="">All apps &amp; hosts</option></select>
    <button class="btn btn-sm btn-success" id="addSwagger" type="button">+ Add API from Swagger</button>`,
  source: () => "",
  // Filter value is "<hostId>" for one host or "app:<appId>" for every host linked to that app
  sort: rows => {
    const v = main.querySelector(".host-filter")?.value;
    if (!v) return rows;
    if (v.startsWith("app:")) { const ids = new Set(appLinks.filter(l => String(l.applicationId) === v.slice(4)).map(l => String(l.apiHostId))); return rows.filter(r => ids.has(String(r.apiHostId))); }
    return rows.filter(r => String(r.apiHostId) === v);
  },
  rowActions: [
    { label: "Audit", onClick: r => location.href = "apiaudit.html?id=" + r.id },
    { label: "Exceptions", onClick: r => location.href = "apiexceptions.html?audit=" + r.id }
  ]
});
const hf = main.querySelector(".host-filter");
let appLinks = [];
Promise.all([
  Cocky.api.list("apihosts"),
  // Apps are optional: if the API doesn't have them yet, the filter just lists hosts
  Promise.all([Cocky.api.list("apps"), Cocky.api.list("apphosts")]).catch(() => [[], []])
]).then(([hs, [apps, links]]) => {
  appLinks = links;
  const hostOpts = hs.map(h => `<option value="${h.id}">#${h.id} ${Cocky.esc(h.apiHostName || h.apiHostUrl || "")}</option>`).join("");
  const appOpts = apps.slice().sort((a, b) => String(a.applicationName || "").localeCompare(String(b.applicationName || "")))
    .map(a => `<option value="app:${a.id}">${Cocky.esc(a.applicationName || "App #" + a.id)}</option>`).join("");
  hf.insertAdjacentHTML("beforeend", appOpts ? `<optgroup label="Apps">${appOpts}</optgroup><optgroup label="Hosts">${hostOpts}</optgroup>` : hostOpts);
  const qs = new URLSearchParams(location.search);
  if (qs.get("app")) { hf.value = "app:" + qs.get("app"); page.reload(); }
  else if (qs.get("host")) { hf.value = qs.get("host"); page.reload(); }
}).catch(() => {});
hf.onchange = () => page.reload();
document.getElementById("addSwagger").onclick = async () => { if (await SwaggerImport.open()) page.reload(); };
</script>
</body>
</html>
