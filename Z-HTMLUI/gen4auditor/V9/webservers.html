<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Servers · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Web Servers</h2>
  <div class="page-sub">Every web server you audit, whether it runs on its own or as a member of a web farm (farm membership is set on the <a href="webfarms.html">Web Farms</a> page).
    <b>Findings</b> checks each server against the policy in <code>config.js</code>. Hover to see the problems, or click to open them in <a href="infraaudit.html?kind=webservers">Infra Audit</a>.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="infra.js"></script>
<script>
const main = Cocky.layout("webservers");
const esc = Cocky.esc;
let audit = Infra.evaluate({});

// Reloaded with the table: the other tables the Findings and Farms columns need
async function refreshAudit() { audit = Infra.evaluate(await Infra.loadAll()); }

Cocky.SCHEMA.webservers.format = {
  farms: (v, r) => {
    const farms = audit.index.farmsOf(r.id).map(id => audit.index.wf.get(id)).filter(Boolean);
    return farms.length ? farms.map(f => `<a href="webfarms.html" class="badge text-bg-light border fw-normal text-decoration-none me-1">${esc(Infra.KINDS.webfarms.name(f))}</a>`).join("")
      : '<span class="small text-muted">standalone</span>';
  },
  findings: (v, r) => Infra.badge(audit.get("webservers", r.id))
};

(async () => {
  if (!await Infra.guard("webservers", main)) return;
  Cocky.crudPage("webservers", {
    mount: main,
    columns: Cocky.SCHEMA.webservers.columns,
    beforeLoad: refreshAudit,
    sort: rows => rows.slice().sort((a, b) => Infra.KINDS.webservers.name(a).localeCompare(Infra.KINDS.webservers.name(b))),
    // Applications point at a web server with a foreign key, so they have to be moved first
    canDelete: r => {
      const apps = audit.index.appsUsing("webServerId", r.id);
      if (apps.length) return `Can't delete: ${apps.length} application(s) run on this server (${apps.map(Infra.KINDS.apps.name).join(", ")}). Change them on the Apps page first.`;
    },
    // Remove its farm memberships first (WebFarmServers doesn't cascade); they're put back if the delete fails
    beforeDelete: r => Cocky.removeLinks("webfarmservers", l => Infra.num(l, "webServerId") === r.id, ["webFarmId", "webServerId"])
  });
})();
</script>
</body>
</html>
