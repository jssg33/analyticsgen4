<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endpoints · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Endpoints</h2>
  <div class="page-sub">Every endpoint registered for auditing. To import a whole API at once, use <b>Add API from Swagger</b>.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="swagger-import.js"></script>
<script>
const main = Cocky.layout("endpoints");
const page = Cocky.crudPage("apiaudit", {
  mount: main,
  toolbarExtra: `<select class="form-select form-select-sm host-filter" style="max-width:220px"><option value="">All hosts</option></select>
    <button class="btn btn-sm btn-success" id="addSwagger" type="button">+ Add API from Swagger</button>`,
  source: () => "",
  sort: rows => { const h = main.querySelector(".host-filter")?.value; return h ? rows.filter(r => String(r.apiHostId) === h) : rows; },
  rowActions: [
    { label: "Audit", onClick: r => location.href = "apiaudit.html?id=" + r.id },
    { label: "Exceptions", onClick: r => location.href = "apiexceptions.html?audit=" + r.id }
  ]
});
const hf = main.querySelector(".host-filter");
Cocky.api.list("apihosts").then(hs => {
  hf.insertAdjacentHTML("beforeend", hs.map(h => `<option value="${h.id}">#${h.id} ${Cocky.esc(h.apiHostName || h.apiHostUrl || "")}</option>`).join(""));
  const q = new URLSearchParams(location.search).get("host"); if (q) { hf.value = q; page.reload(); }
}).catch(() => {});
hf.onchange = () => page.reload();
document.getElementById("addSwagger").onclick = async () => { if (await SwaggerImport.open()) page.reload(); };
</script>
</body>
</html>
