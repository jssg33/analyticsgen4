<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databases · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Databases</h2>
  <div class="page-sub">Every database lives on a <a href="dbservers.html">database server</a>. <b>Findings</b> checks data protection: PII/PHI/PCI data must be encrypted and classified,
    and databases that require backup must be on a server that has a backup solution.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="infra.js"></script>
<script>
const main = Cocky.layout("databases");
const esc = Cocky.esc;
let data = {}, audit = Infra.evaluate({});
const params = new URLSearchParams(location.search);
let serverFilter = params.get("server") || "";

async function refreshAudit() {
  data = await Infra.loadAll();
  audit = Infra.evaluate(data);
  // Server filter: every server, with how many databases each has
  const sel = document.getElementById("serverFilter");
  const servers = (data.databaseservers || []).slice().sort((a, b) => Infra.KINDS.databaseservers.name(a).localeCompare(Infra.KINDS.databaseservers.name(b)));
  sel.innerHTML = `<option value="">All servers</option>` + servers.map(s =>
    `<option value="${s.id}" ${String(s.id) === serverFilter ? "selected" : ""}>${esc(Infra.KINDS.databaseservers.name(s))} (${audit.index.databasesOn(s.id).length})</option>`).join("");
}

Cocky.SCHEMA.databases.format = {
  databaseServerId: (v, r) => {
    const s = audit.index.dbs.get(Infra.num(r, "databaseServerId"));
    return s ? `<a href="dbservers.html" class="text-decoration-none">${esc(Infra.KINDS.databaseservers.name(s))}</a>${Infra.str(s, "environment") ? ` <span class="small text-muted">${esc(Infra.str(s, "environment"))}</span>` : ""}`
      : `<span class="badge text-bg-danger">#${esc(v)} missing</span>`;
  },
  dataFlags: (v, r) => {
    const flags = Infra.sensitive(r);
    return flags.length ? flags.map(f => `<span class="badge text-bg-info me-1">${f}</span>`).join("") : '<span class="small text-muted">none</span>';
  },
  usedBy: (v, r) => {
    if (!audit.index.appsHaveDatabase) return '<span class="small text-muted" title="Application has no DatabaseId yet">n/a</span>';
    const apps = audit.index.appsUsing("databaseId", r.id);
    return apps.length ? apps.map(a => `<a href="apiapps.html" class="badge text-bg-light border fw-normal text-decoration-none me-1">${esc(Infra.KINDS.apps.name(a))}</a>`).join("") : '<span class="small text-muted">—</span>';
  },
  findings: (v, r) => Infra.badge(audit.get("databases", r.id))
};

let page;
(async () => {
  if (!await Infra.guard("databases", main)) return;
  page = Cocky.crudPage("databases", {
    mount: main,
    toolbarExtra: '<select class="form-select form-select-sm" id="serverFilter" style="max-width:260px"><option value="">All servers</option></select>',
    columns: Cocky.SCHEMA.databases.columns,
    beforeLoad: refreshAudit,
    sort: rows => rows
      .filter(r => !serverFilter || String(Infra.num(r, "databaseServerId")) === serverFilter)
      .sort((a, b) => Infra.KINDS.databases.name(a).localeCompare(Infra.KINDS.databases.name(b))),
    // "+ Add" on a filtered list puts the new database on that server
    addDefaults: () => serverFilter ? { databaseServerId: +serverFilter } : {},
    canDelete: r => {
      const apps = audit.index.appsUsing("databaseId", r.id);
      if (apps.length) return `Can't delete: ${apps.length} application(s) use this database (${apps.map(Infra.KINDS.apps.name).join(", ")}). Change them on the Apps page first.`;
    }
  });
  document.getElementById("serverFilter").onchange = e => {
    serverFilter = e.target.value;
    const u = new URL(location.href);
    serverFilter ? u.searchParams.set("server", serverFilter) : u.searchParams.delete("server");
    history.replaceState(null, "", u);
    page.reload();
  };
})();
</script>
</body>
</html>
