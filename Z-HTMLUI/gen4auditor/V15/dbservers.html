<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Servers · CockyAuditor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<section data-page>
  <h2>Database Servers</h2>
  <div class="page-sub">Each database server and the <a href="databases.html">databases</a> on it. <b>Findings</b> flags public-facing servers, platform versions past end of support,
    and missing backups when databases on the server require them.</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
<script src="infra.js"></script>
<script>
const main = Cocky.layout("dbservers");
let audit = Infra.evaluate({});
async function refreshAudit() { audit = Infra.evaluate(await Infra.loadAll()); }

Cocky.SCHEMA.databaseservers.format = {
  databaseCount: (v, r) => {
    const dbs = audit.index.databasesOn(r.id);
    const data = dbs.filter(d => Infra.sensitive(d).length).length;
    return `<a href="databases.html?server=${r.id}" class="text-decoration-none"><b>${dbs.length}</b></a>` +
      (data ? ` <span class="badge text-bg-info fw-normal" title="Databases holding PII, PHI or PCI data">${data} sensitive</span>` : "");
  },
  findings: (v, r) => Infra.badge(audit.get("databaseservers", r.id))
};

(async () => {
  if (!await Infra.guard("databaseservers", main)) return;
  Cocky.crudPage("databaseservers", {
    mount: main,
    columns: Cocky.SCHEMA.databaseservers.columns,
    beforeLoad: refreshAudit,
    sort: rows => rows.slice().sort((a, b) => Infra.KINDS.databaseservers.name(a).localeCompare(Infra.KINDS.databaseservers.name(b))),
    // Databases.DatabaseServerId is a required foreign key: databases are never deleted along with their server
    canDelete: r => {
      const n = audit.index.databasesOn(r.id).length;
      if (n) return `Can't delete: ${n} database(s) are on this server. Move them to another server or delete them on the Databases page first.`;
    },
    rowActions: [{ label: "Databases", onClick: r => location.href = "databases.html?server=" + r.id }]
  });
})();
</script>
</body>
</html>
