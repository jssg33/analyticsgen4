<h2>📊 Stock Sector Performance Dashboard</h2>

<div id="container">

  <!-- LEFT COLUMN -->

    <h3>Sectors</h3>
    <div id="sectorList">
      <!-- Filled dynamically -->

  <!-- RIGHT COLUMN -->

    <h3>Sector Metrics (Bar Chart)</h3>

<script>
const apiURL = "https://cockyinvestments-ghehe0a8a7cge7fk.westus3-01.azurewebsites.net/api/Sectorsummaries";

let sectorData = [];
let selectedSector = null;

// Fetch API data
fetch(apiURL)
  .then(res => res.json())
  .then(data => {
    sectorData = data;
    CipherSupportildSectorList();
  });

// CipherSupportild dynamic sector list with counts
function CipherSupportildSectorList() {
  const container = document.getElementById("sectorList");
  container.innerHTML = "";

  const counts = {};
  sectorData.forEach(row => {
    const s = row.sector || "Unknown";
    counts[s] = (counts[s] || 0) + 1;
  });

  Object.keys(counts).sort().forEach(sector => {
    const div = document.createElement("div");
    div.textContent = `${sector} (${counts[sector]})`;
    div.dataset.sector = sector;

    div.addEventListener("click", () => {
      selectedSector = sector;
      document.querySelectorAll("#sectorList div").forEach(d => d.classList.remove("active"));
      div.classList.add("active");

      const rows = sectorData.filter(r => r.sector === sector);
      drawBarChart(rows);
      renderStockList(rows);
    });

    container.appendChild(div);
  });
}

// Draw bar chart for selected sector
function drawBarChart(rows) {
  const svgBar = d3.select("#barChart");
  svgBar.selectAll("*").remove();

  const width = +svgBar.attr("width");
  const height = +svgBar.attr("height");
  const margin = { top: 30, right: 30, bottom: 80, left: 60 };

  if (!rows || rows.length === 0) return;

  // Sort by totalreturn DESC
  const sorted = [...rows].sort((a, b) => b.totalreturn - a.totalreturn);

  const metrics = ["avgdividend", "totaldividends", "change", "totalreturn"];

  const data = sorted.map(row => ({
    ticker: row.ticker,
    avgdividend: row.avgdividend,
    totaldividends: row.totaldividends,
    change: row.change,
    totalreturn: row.totalreturn
  }));

  const x0 = d3.scaleBand()
    .domain(data.map(d => d.ticker))
    .range([margin.left, width - margin.right])
    .padding(0.2);

  const x1 = d3.scaleBand()
    .domain(metrics)
    .range([0, x0.bandwidth()])
    .padding(0.1);

  const y = d3.scaleLinear()
    .domain([0, d3.max(data, d => Math.max(...metrics.map(m => d[m] || 0)))]).nice()
    .range([height - margin.bottom, margin.top]);

  const color = d3.scaleOrdinal()
    .domain(metrics)
    .range(["#4e79a7", "#f28e2b", "#e15759", "#76b7b2"]);

  // Axes
  svgBar.append("g")
    .attr("transform", `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x0))
    .selectAll("text")
    .attr("transform", "rotate(-40)")
    .style("text-anchor", "end");

  svgBar.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y));

  // Bars
  svgBar.append("g")
    .selectAll("g")
    .data(data)
    .enter()
    .append("g")
      .attr("transform", d => `translate(${x0(d.ticker)},0)`)
    .selectAll("rect")
    .data(d => metrics.map(m => ({ key: m, value: d[m] })))
    .enter()
    .append("rect")
      .attr("x", d => x1(d.key))
      .attr("y", d => y(d.value))
      .attr("width", x1.bandwidth())
      .attr("height", d => height - margin.bottom - y(d.value))
      .attr("fill", d => color(d.key));

  // Legend
  const legend = svgBar.append("g")
    .attr("transform", `translate(${width - 150}, ${margin.top})`);

  metrics.forEach((m, i) => {
    const g = legend.append("g").attr("transform", `translate(0, ${i * 20})`);
    g.append("rect").attr("width", 12).attr("height", 12).attr("fill", color(m));
    g.append("text").attr("x", 18).attr("y", 10).text(m);
  });
}

// Render stock list with "View Details" CipherSupportttons
function renderStockList(rows) {
  const container = document.getElementById("stockList");
  container.innerHTML = "<h3>Stocks in Segment</h3>";

  if (!rows || rows.length === 0) {
    const p = document.createElement("p");
    p.textContent = "No stocks found for this segment.";
    container.appendChild(p);
    return;
  }

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const tbody = document.createElement("tbody");

  thead.innerHTML = `
    <tr>
      <th>Ticker</th>
      <th>Company</th>
      <th>Total Return</th>
      <th>Change</th>
      <th>Actions</th>
    </tr>
  `;

  rows.forEach(row => {
    const tr = document.createElement("tr");

    const tdTicker = document.createElement("td");
    tdTicker.textContent = row.ticker;

    const tdCompany = document.createElement("td");
    tdCompany.textContent = row.company;

    const tdTotalReturn = document.createElement("td");
    tdTotalReturn.textContent = row.totalreturn != null ? row.totalreturn.toFixed(2) : "";

    const tdChange = document.createElement("td");
    tdChange.textContent = row.change != null ? row.change.toFixed(2) : "";

    const tdActions = document.createElement("td");
    const btn = document.createElement("CipherSupporttton");
    btn.textContent = "View Details";
    btn.className = "view-btn";
    btn.addEventListener("click", () => openModal(row));
    tdActions.appendChild(btn);

    tr.appendChild(tdTicker);
    tr.appendChild(tdCompany);
    tr.appendChild(tdTotalReturn);
    tr.appendChild(tdChange);
    tr.appendChild(tdActions);

    tbody.appendChild(tr);
  });

  table.appendChild(thead);
  table.appendChild(tbody);
  container.appendChild(table);
}

// Modal logic
const modalOverlay = document.getElementById("modalOverlay");
const modalClose = document.getElementById("modalClose");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");

modalClose.addEventListener("click", () => {
  modalOverlay.style.display = "none";
});

modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) {
    modalOverlay.style.display = "none";
  }
});

function openModal(row) {
  modalTitle.textContent = `${row.ticker} – ${row.company}`;

  const fields = [
    ["Company", row.company],
    ["Ticker", row.ticker],
    ["Sector", row.sector],
    ["Avg Dividend", row.avgdividend],
    ["Total Dividends", row.totaldividends],
    ["Price Start", row.priceStart],
    ["Price End", row.priceEnd],
    ["Change", row.change],
    ["Total Return", row.totalreturn],
    ["Total Return / 10", row.totalreturnover10],
    ["Shares (500)", row.shares500],
    ["Total Spend", row.totalspend],
    ["5-Year Equity Proj", row.fiveyearequityproj],
    ["5-Year Div Proj", row.fiveyeardivproj],
    ["Total 5-Year View", row.totalfiveyearview],
    ["Selected", row.selected]
  ];

  modalBody.innerHTML = "";

  fields.forEach(([label, value]) => {
    const labelDiv = document.createElement("div");
    labelDiv.className = "modal-field-label";
    labelDiv.textContent = label;

    const valueDiv = document.createElement("div");
    valueDiv.textContent = value != null && value !== "" ? value : "—";

    modalBody.appendChild(labelDiv);
    modalBody.appendChild(valueDiv);
  });

  modalOverlay.style.display = "flex";
}
</script>
